<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>PRODUCTS - CRITZ</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@600&display=swap');
:root{--red:#e10600}*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#000;color:#fff;font-family:'Anton',sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:rgba(0,0,0,0.8);border-bottom:1.5px solid rgba(225,6,0,0.5);backdrop-filter:blur(12px);position:sticky;top:0;z-index:10}
.logo{font-size:18px;letter-spacing:3px;text-shadow:0 0 20px var(--red)}
.nav-right{display:flex;align-items:center;gap:14px}
.login-link{font-family:'Inter',sans-serif;font-size:11px;color:#fff;text-decoration:none;font-weight:600}
.cart-wrap svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:1.8}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr);padding:24px;gap:18px}}
.card{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);border-radius:18px;overflow:hidden;backdrop-filter:blur(12px)}
.card img{width:100%;aspect-ratio:1/1;object-fit:cover;background:#111}
.info{padding:12px}.name{font-size:12px;letter-spacing:1.5px;line-height:1.1}.price{font-family:'Inter',sans-serif;font-size:12px;color:var(--red);margin-top:6px;font-weight:700}
.btn{margin-top:10px;width:100%;padding:10px;border-radius:30px;border:0;background:var(--red);color:#fff;font-family:'Anton',sans-serif;letter-spacing:2px;font-size:10px}
</style>
</head>
<body>
<header>
<div style="display:flex;flex-direction:column"><div class="logo">CRITZ</div><div style="font-size:6px;letter-spacing:1.5px;opacity:0.7">LAGOS NIGERIA - <span style="color:var(--red)">SHIPPING WORLDWIDE</span></div></div>
<div class="nav-right"><a href="login.html" class="login-link">LOGIN</a><a href="cart.html" class="cart-wrap"><svg viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 01-8 0"/></svg></a></div>
</header>
<div class="grid">
<div class="card"><img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=400"><div class="info"><div class="name">CRTZ MOVEMENT TEE BLACK</div><div class="price">₦18,000</div><button class="btn">ADD TO CART</button></div></div>
<div class="card"><img src="https://images.unsplash.com/photo-1583743814966-8936f5b7be1a?w=400"><div class="info"><div class="name">CRTZ LOGO HOODIE RED</div><div class="price">₦32,000</div><button class="btn">ADD TO CART</button></div></div>
<div class="card"><img src="https://images.unsplash.com/photo-1556821840-3a63f95609a7?w=400"><div class="info"><div class="name">CRTZ TRACK PANT BLACK</div><div class="price">₦28,000</div><button class="btn">ADD TO CART</button></div></div>
<div class="card"><img src="https://images.unsplash.com/photo-1578681994506-b8f463449011?w=400"><div class="info"><div class="name">CRTZ CAP LAGOS</div><div class="price">₦12,000</div><button class="btn">ADD TO CART</button></div></div>
</div>
</body>
</html>
