<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SHOP - CRITZ</title>
<style>
:root{--red:#e10600;--black:#0a0a0a;--white:#fff;--gray:#111;}
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;-webkit-tap-highlight-color: transparent;}
body{background:var(--black);color:var(--white)}
body.no-scroll{overflow:hidden}

header{position:fixed;top:0;width:100%;padding:18px 20px;display:flex;justify-content:space-between;align-items:center;z-index:10;background:rgba(10,10,10,0.95);backdrop-filter:blur(10px);border-bottom:1px solid rgba(225,6,0,0.3)}
.logo{font-size:20px;font-weight:900}.logo span{color:var(--red)}
.nav a{color:var(--white);text-decoration:none;margin-left:18px;text-transform:uppercase;font-size:11px;font-weight:700}

.products{padding:100px 15px 100px;display:grid;grid-template-columns:repeat(2, 1fr);gap:15px;max-width:1400px;margin:0 auto}
.product-card{background:#111;border:1px solid rgba(225,6,0,0.2);border-radius:12px;overflow:hidden;transition:0.3s;text-align:center}
.product-card:active{transform:scale(0.97)} /* tap feedback */
.product-card img{width:100%;height:220px;object-fit:cover;background:#fff;cursor:pointer}
.info{padding:12px}
.info h3{text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;font-size:13px}
.price{color:var(--red);font-size:16px;font-weight:900;margin-bottom:10px}

/* VIEW BUTTON WITH FLOAT ANIMATION */
.view-btn{
  background:var(--red);color:var(--white);border:none;padding:12px;width:100%;
  font-weight:900;cursor:pointer;border-radius:8px;transition:0.3s;text-transform:uppercase;
  letter-spacing:1px; font-size:12px;
}
.view-btn:active{
  animation: floatUpDown 0.4s ease-in-out; /* MOBILE TAP */
  background:#fff;color:var(--red);
}
.view-btn:hover{
  background:#fff;color:var(--red);
  animation: floatUpDown 0.8s ease-in-out infinite; /* DESKTOP HOVER */
  box-shadow:0 0 20px rgba(225,6,0,0.6);
}

@keyframes floatUpDown {
 0%, 100% { transform: translateY(0); }
 50% { transform: translateY(-5px); }
}

/* RIGHT SIDE DRAWER - MOBILE FULLSCREEN */
.drawer-overlay{
  position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9);
  backdrop-filter:blur(8px); z-index:999; opacity:0; visibility:hidden; transition:0.3s;
}
.drawer-overlay.active{ opacity:1; visibility:visible; }

.drawer{
  position:fixed; top:0; right:-100%; width:100%; max-width:100%; height:100%;
  background:var(--black); z-index:1000; transition: right 0.4s cubic-bezier(0.25, 1, 0.5, 1);
  display:flex; flex-direction:column;
}
.drawer.active{ right:0; }

.drawer-header{
  display:flex; justify-content:space-between; align-items:center;
  padding:18px 20px; border-bottom:1px solid #222; position:sticky; top:0; background:var(--black); z-index:2;
}
.drawer-header h3{ font-size:13px; letter-spacing:2px; text-transform:uppercase }
.close-btn{ font-size:32px; background:none; border:none; color:var(--white); cursor:pointer; line-height:1 }

.drawer-body{
  display:flex; flex-direction:column; gap:20px; padding:20px; overflow-y:auto; height:100%;
  padding-bottom:120px; /* space for sticky buttons */
}
.drawer-images{ display:flex; gap:10px; overflow-x:auto; scroll-snap-type:x mandatory; }
.drawer-images img{ width:100%; min-width:100%; background:#fff; border-radius:8px; border:1px solid #222; scroll-snap-align:start; }

.drawer-info h2{ font-size:20px; text-transform:uppercase; margin-bottom:8px; letter-spacing:1px }
.drawer-info.price{ font-size:22px; color:var(--red); font-weight:900; margin-bottom:20px }

.option-group{ margin-bottom:20px }
.option-group h4{ font-size:12px; letter-spacing:2px; margin-bottom:12px; color:#aaa; text-transform:uppercase }

.sizes{ display:flex; gap:10px; flex-wrap:wrap; }
.size-btn{
  padding:12px 18px; border:1px solid #444; background:transparent; color:var(--white);
  cursor:pointer; font-size:14px; font-weight:700; transition:0.2s; min-width:50px; border-radius:6px;
}
.size-btn.active,.size-btn:active{ background:var(--white); color:var(--black); border-color:var(--white) }

.qty-row{ display:flex; align-items:center; gap:15px; margin:20px 0 }
.qty-box{ display:flex; border:1px solid #444; border-radius:6px; overflow:hidden }
.qty-btn{ background:#222; color:#fff; border:none; padding:14px 18px; cursor:pointer; font-size:18px; min-width:50px }
.qty-input{ width:60px; text-align:center; background:transparent; border:none; color:#fff; font-size:16px }

.btn-group{
  position:fixed; bottom:0; left:0; width:100%; padding:15px; background:rgba(10,10,10,0.95);
  backdrop-filter:blur(10px); border-top:1px solid #222; display:flex; flex-direction:column; gap:10px;
}
.btn{ padding:16px; width:100%; border:none; font-weight:900; cursor:pointer; transition:0.3s; text-transform:uppercase; letter-spacing:1px; border-radius:10px; font-size:15px }
.btn-cart{ background:var(--white); color:var(--black) }
.btn-cart:active{ background:var(--red); color:var(--white) }
.btn-buy{ background:var(--red); color:var(--white) }
.btn-buy:active{ background:#fff; color:var(--red) }

/* TABLET + DESKTOP */
@media(min-width:768px){
  header{padding:30px 50px}
 .logo{font-size:24px}
 .nav a{font-size:12px;margin-left:25px}
 .products{grid-template-columns:repeat(3, 1fr);gap:40px;padding:140px 50px 100px}
 .product-card img{height:400px}
 .info h3{font-size:16px}
 .price{font-size:20px}
 .drawer{ max-width:900px; border-left:2px solid var(--red); }
 .drawer-body{ display:grid; grid-template-columns: 1fr 1fr; }
 .drawer-images{ flex-direction:column; overflow:visible }
 .drawer-images img{ min-width:100% }
 .btn-group{ position:static; background:transparent; padding:0; border:none }
}
</style>
</head>
<body>

<header>
  <div class="logo">CRI<span>TZ</span></div>
  <div class="nav">
    <a href="index.html">HOME</a>
    <a href="products.html">SHOP</a>
    <a href="cart.html">🛍️ CART</a>
  </div>
</header>

<section class="products">
  <div class="product-card">
    <img src="longsleeve.png" alt="LONG SLEEVE TEE" onclick="openDrawer('longsleeve')">
    <div class="info">
      <h3>LONG SLEEVE TEE</h3>
      <div class="price">₦35,000</div>
      <button class="view-btn" onclick="handleViewClick('longsleeve', this)">VIEW</button>
    </div>
  </div>

  <div class="product-card">
    <img src="hoodie.png" alt="CRITZ HOODIE" onclick="openDrawer('hoodie')">
    <div class="info">
      <h3>CRITZ HOODIE</h3>
      <div class="price">₦40,000</div>
      <button class="view-btn" onclick="handleViewClick('hoodie', this)">VIEW</button>
    </div>
  </div>

  <div class="product-card">
    <img src="harmlesstee.png" alt="GRAPHIC SLEEVELESS TEE" onclick="openDrawer('sleeveless')">
    <div class="info">
      <h3>GRAPHIC SLEEVELESS TEE</h3>
      <div class="price">₦25,000</div>
      <button class="view-btn" onclick="handleViewClick('sleeveless', this)">VIEW</button>
    </div>
  </div>
</section>

<!-- RIGHT SIDE DRAWER -->
<div class="drawer-overlay" id="overlay" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-header">
    <h3>SELECT OPTIONS</h3>
    <button class="close-btn" onclick="closeDrawer()">×</button>
  </div>
  <div class="drawer-body">
    <div class="drawer-images" id="drawer-images"></div>
    <div class="drawer-info">
      <h2 id="drawer-title"></h2>
      <p class="price" id="drawer-price"></p>

      <div class="option-group">
        <h4 id="size-label">SIZE: M</h4>
        <div class="sizes" id="size-options"></div>
      </div>

      <div class="qty-row">
        <div class="qty-box">
          <button class="qty-btn" onclick="changeQty(-1)">−</button>
          <input type="text" class="qty-input" id="qty" value="1" readonly>
          <button class="qty-btn" onclick="changeQty(1)">+</button>
        </div>
      </div>

      <div class="btn-group">
        <button class="btn btn-cart" onclick="addToCartFromDrawer()">ADD TO CART</button>
        <button class="btn btn-buy" onclick="buyNow()">BUY IT NOW</button>
      </div>
    </div>
  </div>
</div>

<script>
const products = {
  "longsleeve": {
    title: "LONG SLEEVE TEE",
    price: 35000,
    images: ["longsleeve.png", "longsleeve-back.png"],
    sizes: ["S", "M", "L", "XL", "XXL"]
  },
  "hoodie": {
    title: "CRITZ HOODIE",
    price: 40000,
    images: ["hoodie.png", "hoodie-back.png"],
    sizes: ["M", "L", "XL", "XXL"]
  },
  "sleeveless": {
    title: "GRAPHIC SLEEVELESS TEE",
    price: 25000,
    images: ["harmlesstee.png", "harmlesstee-back.png"],
    sizes: ["S", "M", "L", "XL"]
  }
};

let currentProduct = null;
let selectedSize = null;
let qty = 1;

function handleViewClick(productId, btn){
  btn.style.transform = 'scale(0.95)';
  setTimeout(()=>btn.style.transform='scale(1)', 100);
  openDrawer(productId);
}

function openDrawer(productId){
  currentProduct = products[productId];
  selectedSize = currentProduct.sizes[1] || currentProduct.sizes[0];
  qty = 1;

  document.getElementById('drawer-title').innerText = currentProduct.title;
  document.getElementById('drawer-price').innerText = `₦${currentProduct.price.toLocaleString()}.00`;
  document.getElementById('qty').value = qty;

  const imgDiv = document.getElementById('drawer-images');
  imgDiv.innerHTML = '';
  currentProduct.images.forEach(img => {
    imgDiv.innerHTML += `<img src="${img}" alt="${currentProduct.title}">`;
  });

  const sizeDiv = document.getElementById('size-options');
  sizeDiv.innerHTML = '';
  currentProduct.sizes.forEach((s) => {
    sizeDiv.innerHTML += `<button class="size-btn ${s===selectedSize?'active':''}" onclick="selectSize('${s}', this)">${s}</button>`;
  });
  updateSizeLabel();

  document.body.classList.add('no-scroll');
  document.getElementById('overlay').classList.add('active');
  document.getElementById('drawer').classList.add('active');
}

function closeDrawer(){
  document.body.classList.remove('no-scroll');
  document.getElementById('overlay').classList.remove('active');
  document.getElementById('drawer').classList.remove('active');
}

function selectSize(size, el){
  selectedSize = size;
  document.querySelectorAll('.size-btn').forEach(btn=>btn.classList.remove('active'));
  el.classList.add('active');
  updateSizeLabel();
}

function updateSizeLabel(){
  document.getElementById('size-label').innerText = `SIZE: ${selectedSize}`;
}

function changeQty(val){
  qty += val;
  if(qty < 1) qty = 1;
  document.getElementById('qty').value = qty;
}

function addToCartFromDrawer(){
  let cart = JSON.parse(localStorage.getItem('stylevaultCart')) || [];
  let itemKey = currentProduct.title + '-' + selectedSize;
  let existing = cart.find(item => item.key === itemKey);

  if(existing){ existing.qty += qty; }
  else {
    cart.push({ key: itemKey, name: currentProduct.title, size: selectedSize, price: currentProduct.price, img: currentProduct.images[0], qty: qty });
  }
  localStorage.setItem('stylevaultCart', JSON.stringify(cart));
  alert(`${currentProduct.title} - Size ${selectedSize} x${qty} added to cart!`);
  closeDrawer();
}

function buyNow(){
  let cart = JSON.parse(localStorage.getItem('stylevaultCart')) || [];
  let itemKey = currentProduct.title + '-' + selectedSize;
  let existing = cart.find(item => item.key === itemKey);

  if(existing){ existing.qty += qty; }
  else {
    cart.push({ key: itemKey, name: currentProduct.title, size: selectedSize, price: currentProduct.price, img: currentProduct.images[0], qty: qty });
  }
  localStorage.setItem('stylevaultCart', JSON.stringify(cart));
  window.location.href = 'cart.html';
}
</script>

</body>
</html>
